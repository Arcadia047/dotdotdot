set -g default-terminal "tmux-256color"
%if "#{==:#{m:*xterm-256color:RGB*,#{terminal-features}},0}"
set -as terminal-features ",xterm-256color:RGB"
%endif
%if "#{==:#{m:*wezterm:RGB*,#{terminal-features}},0}"
set -as terminal-features ",wezterm:RGB"
%endif
%if "#{==:#{m:*DOTFILES_THEME*,#{update-environment}},0}"
set -ag update-environment " DOTFILES_THEME"
%endif

# Ctrl-a to use as prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# | to split window horizontally
unbind %
bind | split-window -h

# - to split window vertically
unbind '"'
bind - split-window -v

# Ctrl-a r to refresh config
unbind r
bind r source-file ~/.tmux.conf

# bind -r j resize-pane -D 5
# bind -r k resize-pane -U 5
# bind -r l resize-pane -R 5
# bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -gq allow-passthrough on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane 


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# tmux theme
set -g @plugin 'catppuccin/tmux#v2.3.0'
%if "#{==:#{DOTFILES_THEME},light}"
set -g @catppuccin_flavor 'latte'
%else
set -g @catppuccin_flavor 'macchiato'
%endif
set -g @catppuccin_reset 'true'

# The upstream reset clears the core palette but not colors cached by enabled
# status modules. Clear only those derived values so live flavor changes fully
# re-render without discarding icon or text customizations.
set -Ugq @catppuccin_application_color
set -Ugq @catppuccin_battery_color
set -Ugq @catppuccin_cpu_color
set -Ugq @catppuccin_uptime_color
set -Ugq @catppuccin_status_application_icon_bg
set -Ugq @catppuccin_status_application_icon_fg
set -Ugq @catppuccin_status_application_text_fg
set -Ugq @catppuccin_status_battery_icon_bg
set -Ugq @catppuccin_status_battery_icon_fg
set -Ugq @catppuccin_status_battery_text_fg
set -Ugq @catppuccin_status_cpu_icon_bg
set -Ugq @catppuccin_status_cpu_icon_fg
set -Ugq @catppuccin_status_session_icon_bg
set -Ugq @catppuccin_status_session_icon_fg
set -Ugq @catppuccin_status_session_text_fg
set -Ugq @catppuccin_status_uptime_icon_bg
set -Ugq @catppuccin_status_uptime_icon_fg
set -Ugq @catppuccin_status_uptime_text_fg

set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
run ~/.tmux/plugins/tmux/catppuccin.tmux

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
