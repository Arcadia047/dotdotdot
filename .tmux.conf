set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
%if "#{==:#{m:*xterm-256color:RGB*,#{terminal-features}},0}"
set -as terminal-features ",xterm-256color:RGB"
%endif
%if "#{==:#{m:*wezterm:RGB*,#{terminal-features}},0}"
set -as terminal-features ",wezterm:RGB"
%endif
%if "#{==:#{m:*DOTFILES_THEME*,#{update-environment}},0}"
set -ag update-environment " DOTFILES_THEME"
%endif

# Ctrl-a to use as prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# | to split window horizontally
unbind %
bind | split-window -h

# - to split window vertically
unbind '"'
bind - split-window -v

# Ctrl-a r to refresh config
unbind r
bind r source-file ~/.tmux.conf

# bind -r j resize-pane -D 5
# bind -r k resize-pane -U 5
# bind -r l resize-pane -R 5
# bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -gq allow-passthrough on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane 


# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# tmux theme — Rosé Pine, following the repo's theme.conf (installed as
# ~/.config/dotfiles-theme), shared with WezTerm and Neovim.
# `theme light|dark` re-sources this file; the plugin rebuilds its status bar.
set -g @plugin 'rose-pine/tmux'
if-shell '[ "$(cat ~/.config/dotfiles-theme 2>/dev/null)" = "light" ]' \
  "set -g @rose_pine_variant 'dawn'" \
  "set -g @rose_pine_variant 'main'"
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time '%H:%M'
run ~/.tmux/plugins/tmux/rose-pine.tmux

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
# Universal navigation model (see KEYBINDINGS.md):
# Shift+Left/Right switches to the previous/next window — unless the pane is
# running Neovim, in which case the key is passed through so Neovim can switch
# buffers. Extended keys (set above) make S-Left/S-Right bindable.
bind -n S-Left if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys S-Left' 'previous-window'
bind -n S-Right if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys S-Right' 'next-window'

# Back to the previous window (AeroSpace's alt-tab equivalent).
bind a last-window

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
