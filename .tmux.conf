set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
%if "#{==:#{m:*xterm-256color:RGB*,#{terminal-features}},0}"
set -as terminal-features ",xterm-256color:RGB"
%endif
%if "#{==:#{m:*wezterm:RGB*,#{terminal-features}},0}"
set -as terminal-features ",wezterm:RGB"
%endif
# Theme state is authoritative; a stale attaching shell must not replace it.
# Remove legacy imports while preserving all other environment preferences.
set -gF update-environment "#{s/(^| )DOTFILES_THEME( |$)/ /:update-environment}"
set -gF update-environment "#{s/(^| )COLORFGBG( |$)/ /:update-environment}"

set -gq allow-passthrough on

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# Rosé Pine uses the same machine-local mode as WezTerm, the shell, and Neovim.
# Load its pinned submodule explicitly: TPM maps rose-pine/tmux to the legacy
# plugins/tmux directory, which still contains the unused Catppuccin checkout.
if-shell '[ "$(/bin/zsh -df "$HOME/.tmux/../zsh/theme.zsh")" = dark ]' \
  "set -g @rose_pine_variant 'main'; set-environment -g DOTFILES_THEME dark; set-environment -g COLORFGBG '15;0'" \
  "set -g @rose_pine_variant 'dawn'; set-environment -g DOTFILES_THEME light; set-environment -g COLORFGBG '0;15'"
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_left_separator ' '
set -g @rose_pine_window_status_separator '  '
set -g @rose_pine_status_right_prepend_section '#{pane_current_command}'
set -g @rose_pine_status_right_append_section ' · #{session_name} · #(uptime | sed "s/^[^,]*up *//; s/, *[[:digit:]]* user.*//;")'
run ~/.tmux/plugins/rose-pine/rose-pine.tmux
source-file ~/.tmux/theme.conf

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
# Load plugins first, then our authoritative key tables.
run '~/.tmux/plugins/tpm/tpm'
source-file ~/.tmux/navigation.conf
source-file ~/.tmux/copy.conf
