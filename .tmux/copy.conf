# Mouse selection stays visible until y or Enter copies it and returns to input.
set -g mouse on
setw -g mode-keys vi
set -s set-clipboard external
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# A fast drag may deliver its final coordinates only on mouse release. tmux
# moves the cursor then, but does not update the selected range. Reapply the
# current rectangle setting to update that range without losing its active end
# (stop-selection would collapse a rectangular copy to its last column).
bind -T copy-mode-vi MouseDragEnd1Pane if-shell -F '#{rectangle_toggle}' 'send-keys -X rectangle-on' 'send-keys -X rectangle-off'
