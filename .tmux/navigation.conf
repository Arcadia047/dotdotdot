# One authority for terminal navigation, sourced after plugins by .tmux.conf.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind %
unbind '"'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
unbind a
bind Tab last-window
bind -n S-Left previous-window
bind -n S-Right next-window
unbind m
bind z resize-pane -Z
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind C-k send-keys C-k
bind C-l send-keys C-l

# Primary navigation: horizontal = editor buffers, vertical = tmux windows.
# Ctrl-h/l pass directly to the application (normal shell editing outside Vim).
# Ctrl-j/k always select a local tmux window, independent of foreground process.
unbind -n C-h
unbind -n C-l
bind -n C-j next-window
bind -n C-k previous-window
unbind -n 'C-\'

# Explicit focus deliberately exits zoom; outer boundaries never wrap.
bind h if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z' \; if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind j if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z' \; if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind k if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z' \; if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind l if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z' \; if-shell -F '#{pane_at_right}' '' 'select-pane -R'
bind H if-shell -F '#{pane_at_left}' '' "swap-pane -t '{left-of}'"
bind J if-shell -F '#{pane_at_bottom}' '' "swap-pane -t '{down-of}'"
bind K if-shell -F '#{pane_at_top}' '' "swap-pane -t '{up-of}'"
bind L if-shell -F '#{pane_at_right}' '' "swap-pane -t '{right-of}'"

# Task switching remains available from copy mode.
bind -T copy-mode-vi S-Left previous-window
bind -T copy-mode-vi S-Right next-window
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-l
bind -T copy-mode-vi C-j next-window
bind -T copy-mode-vi C-k previous-window
unbind -T copy-mode-vi 'C-\'

bind r switch-client -T resize \; display-message 'Resize: h/l width, k/j height; Esc/Enter exits'
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T resize C-c switch-client -T root
bind -T resize Any switch-client -T root
