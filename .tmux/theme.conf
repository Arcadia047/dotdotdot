# Keep numbered window blocks while the upstream theme styles the rest of tmux.
# Resolve colors from the variant already selected by the shared theme state.
%if "#{==:#{@rose_pine_variant},dawn}"
set -g @dotdotdot_tab_text '#464261'
set -g @dotdotdot_tab_background '#f2e9e1'
set -g @dotdotdot_tab_number '#dfdad9'
set -g @dotdotdot_tab_active '#286983'
set -g @dotdotdot_tab_active_text '#fffaf3'
%else
set -g @dotdotdot_tab_text '#e0def4'
set -g @dotdotdot_tab_background '#26233a'
set -g @dotdotdot_tab_number '#403d52'
set -g @dotdotdot_tab_active '#c4a7e7'
set -g @dotdotdot_tab_active_text '#191724'
%endif

set -g window-status-format '#[fg=#{@dotdotdot_tab_text},bg=#{@dotdotdot_tab_number}] #I #[fg=#{@dotdotdot_tab_text},bg=#{@dotdotdot_tab_background}] #W #[default]'
set -g window-status-current-format '#[fg=#{@dotdotdot_tab_active_text},bg=#{@dotdotdot_tab_active},bold] #I #[fg=#{@dotdotdot_tab_text},bg=#{@dotdotdot_tab_background}] #W #[default]'
set -g window-status-separator '  '
